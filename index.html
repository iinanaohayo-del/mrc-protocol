<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MRC Protocol</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@300;500&family=Inter:wght@300;400;500;600&display=swap');

:root{
  --black:#050505;
  --white:#FFFFFF;
  --khaki:#B8B08D;
  --beige:#E0D7C6;
  --border:#2A2A2A;
  --dim:#666666;
  --dimLight:#101010;
  --muted:#444444;
  --accent:#D4AF37;
  --green:#6F8B74;
  --red:#8B6F6F;
  --serif:'Cinzel',serif;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--white);font-family:var(--sans);min-height:100%}
button{font:inherit}
#app{min-height:100vh}
.select-screen{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.select-inner{width:100%;max-width:400px;text-align:center}
.choose{font-size:10px;color:var(--khaki);letter-spacing:10px;margin-bottom:20px;font-family:var(--serif)}
.protocol-grid{display:grid;gap:12px}
.protocol-btn{padding:24px;background:transparent;border:1px solid var(--border);color:var(--white);cursor:pointer;border-radius:4px;font-family:var(--serif);letter-spacing:3px;transition:.15s}
.protocol-btn:active{transform:scale(.98)}
.wrap{max-width:520px;margin:0 auto;padding:20px 15px}
header{padding:40px 0;border-bottom:1px solid var(--border);margin-bottom:30px}
.eyebrow{color:var(--khaki);letter-spacing:6px;font-size:10px;margin-bottom:8px;font-family:var(--serif)}
h1{font-family:var(--serif);font-size:30px;margin:0;letter-spacing:2px}
.mission-sub{color:var(--dim);font-size:11px;margin-top:10px;font-family:var(--mono)}
.protocol-title{margin-top:20px;color:var(--beige);font-size:12px;line-height:1.7}
.card{padding:20px;border:1px solid var(--border);margin-bottom:20px;border-radius:4px}
.today-card{padding:24px;border-color:var(--khaki)}
.label{color:var(--khaki);font-size:10px;letter-spacing:4px;margin-bottom:14px;font-family:var(--serif)}
.mono{color:var(--beige);font-family:var(--mono);line-height:2;font-size:12px}
.quote{margin-top:16px;color:var(--dim);font-style:italic;font-size:12px}
.weather{border-color:var(--green)}
.weather .label{color:var(--green)}
.weather-text{color:var(--beige);line-height:1.7;font-size:13px}
.navrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:12px}
.tabs{display:flex;gap:20px;flex-wrap:wrap}
.tab-btn{background:none;border:none;color:var(--dim);cursor:pointer;letter-spacing:3px;font-size:11px;font-family:var(--serif);padding:0 0 5px}
.tab-btn.active{color:var(--white);border-bottom:1px solid var(--khaki)}
.progress-wrap{width:70px;height:70px;position:relative;flex:0 0 70px}
.progress-wrap svg{display:block}
.progress-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:16px}
.week{margin-bottom:16px;padding:20px;border-radius:4px;border:1px solid var(--border);background:transparent}
.week.current{border-color:var(--khaki);background:var(--dimLight)}
.week-head{display:flex;justify-content:space-between;margin-bottom:12px;gap:12px}
.weeknum{color:var(--khaki);font-size:10px;font-family:var(--mono)}
.phase{margin-top:4px;color:var(--beige);font-family:var(--serif);font-size:15px}
.load{color:var(--dim);font-size:10px;font-family:var(--mono)}
.tasks{display:flex;gap:10px}
.task{flex:1;padding:10px 0;border-radius:2px;cursor:pointer;border:1px solid var(--dim);background:transparent;color:var(--dim);font-size:9px;font-family:var(--mono)}
.task.done{background:var(--khaki);color:var(--black)}
.terminate-wrap{text-align:center;margin-top:40px}
.terminate{background:none;border:none;color:var(--muted);cursor:pointer;font-size:9px;letter-spacing:2px}
.log-advice{padding:24px}
.log-advice .advice{color:var(--beige);line-height:1.8;font-style:italic}
.log-item{padding:15px 0;border-bottom:1px solid var(--border)}
.log-date{color:var(--dim);font-size:10px;margin-bottom:6px;font-family:var(--mono)}
.log-text{color:var(--beige);line-height:1.7;font-size:13px}
.addlog{width:100%;padding:16px;margin-top:20px;border:none;border-radius:4px;background:var(--white);color:var(--black);cursor:pointer;font-family:var(--serif);letter-spacing:2px}
.schedule{padding:24px;border:1px solid var(--border);line-height:2;color:var(--beige);font-family:var(--mono);font-size:12px}
footer{margin-top:80px;padding:40px 0;border-top:1px solid var(--border);text-align:center}
.footer1{color:var(--muted);font-size:9px;letter-spacing:4px;font-family:var(--serif)}
.footer2{color:var(--muted);font-size:8px;margin-top:12px;font-family:var(--mono)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.15;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:430px){
  .navrow{align-items:flex-start}
  .tabs{gap:12px}
  .task{font-size:8px;padding:10px 3px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const C = {
  black:"#050505", white:"#FFFFFF", khaki:"#B8B08D", beige:"#E0D7C6",
  border:"#2A2A2A", dim:"#666666", dimLight:"#101010", muted:"#444444",
  accent:"#D4AF37", green:"#6F8B74", red:"#8B6F6F"
};

const PROTOCOLS = {
 A:{title:"DISCIPLINE / MINIMAL / URBAN",quote:"Discipline reveals freedom."},
 B:{title:"MOUNTAIN / ENDURANCE / NATURE",quote:"Run until silence appears."},
 C:{title:"ZEN / RECOVERY / LONG LIFE",quote:"Recovery is also training."}
};

function genWeeks(){
  const phases=[
    {name:"BASE BUILD",desc:"基礎構築。脂肪燃焼と持久力。"},
    {name:"STRENGTH & SPEED",desc:"スピード持久力向上。"},
    {name:"SPECIFIC PHASE",desc:"レース適応。"},
    {name:"TAPER & PEAK",desc:"疲労抜きと調整。"}
  ];
  const weeks=[];
  for(let i=1;i<=28;i++){
    let load=0;
    if(i<=8) load=40+i*5;
    else if(i<=16) load=70+(i-8)*4;
    else if(i<=24) load=95-(i-16)*2;
    else load=60-(i-24)*10;
    const phaseIndex=i<=8?0:i<=16?1:i<=24?2:3;
    const recovery=i%4===0;
    weeks.push({
      week:i, phase:phases[phaseIndex].name, desc:phases[phaseIndex].desc, load,
      tasks:recovery?["RECOVERY","MOBILITY","LIGHT JOG"]:["RUN","CALISTHENICS","JOURNAL"]
    });
  }
  return weeks;
}

function getCurrentWeek(){
  const start=localStorage.getItem("mrc_start");
  if(!start) return 1;
  const diff=Math.floor((Date.now()-new Date(start).getTime())/(1000*60*60*24*7))+1;
  return Math.min(Math.max(diff,1),28);
}

const quotes=[
 "Pain is inevitable. Suffering is optional.",
 "Stay hard.",
 "Discipline reveals freedom.",
 "Run until silence appears.",
 "Recovery is also training.",
 "Chaos and balance."
];

let state={
 protocol:localStorage.getItem("mrc_protocol")||null,
 progress:JSON.parse(localStorage.getItem("mrc_progress")||"{}"),
 logs:JSON.parse(localStorage.getItem("mrc_logs")||"[]"),
 tab:"weeks",
 advice:quotes[Math.floor(Math.random()*quotes.length)]
};

function saveProgress(){localStorage.setItem("mrc_progress",JSON.stringify(state.progress))}
function saveLogs(){localStorage.setItem("mrc_logs",JSON.stringify(state.logs))}

function selectProtocol(id){
 state.protocol=id;
 localStorage.setItem("mrc_protocol",id);
 localStorage.setItem("mrc_start",new Date().toISOString());
 render();
}
function resetProtocol(){
 state.protocol=null;
 localStorage.removeItem("mrc_protocol");
 localStorage.removeItem("mrc_start");
 render();
}
function toggleProgress(key){
 if(state.progress[key]) delete state.progress[key]; else state.progress[key]=true;
 saveProgress(); render();
}
function addLog(){
 state.logs.unshift({date:new Date().toLocaleDateString(),text:"Morning Session: Completed."});
 saveLogs(); render();
}
function setTab(t){state.tab=t;if(t==="logs")state.advice=quotes[Math.floor(Math.random()*quotes.length)];render()}

function progressCircle(pct){
 const r=45, c=2*Math.PI*r, dash=(pct/100)*c;
 return `<div class="progress-wrap">
 <svg width="70" height="70" viewBox="0 0 100 100">
   <circle cx="50" cy="50" r="45" fill="none" stroke="${C.dimLight}" stroke-width="2"/>
   <circle cx="50" cy="50" r="45" fill="none" stroke="${C.khaki}" stroke-width="2"
     stroke-dasharray="${dash} ${c}" transform="rotate(-90 50 50)"/>
 </svg>
 <div class="progress-text">${Math.round(pct)}%</div>
 </div>`;
}

function selectScreen(){
 return `<div class="select-screen"><div class="select-inner fade">
   <div class="choose">CHOOSE YOUR PATH</div>
   <div class="protocol-grid">
    ${["A","B","C"].map(id=>`<button class="protocol-btn" onclick="selectProtocol('${id}')">PROTOCOL ${id}</button>`).join("")}
   </div>
 </div></div>`;
}

function weatherProtocol(){
 const rainy=new Date().getSeconds()%2===0;
 if(!rainy) return "";
 return `<div class="card weather fade">
   <div class="label">WEATHER PROTOCOL ACTIVE</div>
   <div class="weather-text">Today is for recovery.<br>Listen to the body.</div>
 </div>`;
}

function sessionCard(){
 return `<div class="card">
   <div class="label">LAST SESSION</div>
   <div class="mono">DISTANCE : 8.12km<br>PACE : 5'42<br>HR AVG : 148<br>VO2 EST : 51</div>
 </div>`;
}

function weeksView(weeks,currentWeek){
 return `<div class="fade">
 ${weeks.map(w=>`<div class="week ${w.week===currentWeek?"current":""}">
   <div class="week-head">
    <div><div class="weeknum">WEEK ${String(w.week).padStart(2,"0")}</div><div class="phase">${w.phase}</div></div>
    <div class="load">LOAD ${w.load}%</div>
   </div>
   <div class="tasks">
     ${w.tasks.map(task=>{
       const key=`${w.week}-${task}`;
       return `<button class="task ${state.progress[key]?"done":""}" onclick="toggleProgress('${key.replace(/'/g,"\\'")}')">${task}</button>`;
     }).join("")}
   </div>
 </div>`).join("")}
 <div class="terminate-wrap"><button class="terminate" onclick="resetProtocol()">TERMINATE CURRENT PROTOCOL</button></div>
 </div>`;
}

function logsView(){
 return `<div class="fade">
  <div class="card log-advice">
   <div class="label">SAGE ADVICE</div>
   <div class="advice">"${state.advice}"</div>
  </div>
  ${state.logs.map(l=>`<div class="log-item"><div class="log-date">${l.date}</div><div class="log-text">${l.text}</div></div>`).join("")}
  <button class="addlog" onclick="addLog()">ADD DAILY LOG</button>
 </div>`;
}

function scheduleView(){
 return `<div class="schedule fade">
  05:00 MEDITATION<br>
  05:15 BREATHWORK<br>
  05:30 RUNNING SESSION<br>
  06:30 JOURNALING<br>
  21:00 RECOVERY MODE<br>
  ---<br>
  SIMPLE & HIGH-QUALITY LIFE.
 </div>`;
}

function mainView(){
 const weeks=genWeeks(), currentWeek=getCurrentWeek();
 const totalTasks=weeks.reduce((a,w)=>a+w.tasks.length,0);
 const completedTasks=Object.values(state.progress).filter(Boolean).length;
 const pct=(completedTasks/totalTasks)*100;
 const p=PROTOCOLS[state.protocol];
 let content=state.tab==="weeks"?weeksView(weeks,currentWeek):state.tab==="logs"?logsView():scheduleView();

 return `<div class="wrap fade">
  <header>
    <div class="eyebrow">PROTOCOL ${state.protocol} / ACTIVE</div>
    <h1>MRC PROTOCOL</h1>
    <p class="mission-sub">SUB-2:00:00 MISSION / TEGANUMA 2026</p>
    <div class="protocol-title">${p.title}</div>
  </header>

  <div class="card today-card">
    <div class="label">TODAY'S MISSION</div>
    <div class="mono">05:30 / MORNING RUN<br>ZONE 2 / 8km</div>
    <div class="quote">"${p.quote}"</div>
  </div>

  ${weatherProtocol()}
  ${sessionCard()}

  <div class="navrow">
   <div class="tabs">
    ${["weeks","logs","schedule"].map(t=>`<button class="tab-btn ${state.tab===t?"active":""}" onclick="setTab('${t}')">${t.toUpperCase()}</button>`).join("")}
   </div>
   ${progressCircle(pct)}
  </div>

  ${content}

  <footer>
    <div class="footer1">FOR THE ONES BEHIND YOU</div>
    <div class="footer2">© 2026 MŌSŌ RUNNING CLUB / omoiyari.shikumi</div>
  </footer>
 </div>`;
}

function render(){
 document.getElementById("app").innerHTML=state.protocol?mainView():selectScreen();
}
render();
</script>
</body>
</html>
