<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#080806"/>
<title>MRC Protocol v37</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&display=swap');
:root{
 --black:#080806;--white:#F5F0E8;--khaki:#8B8570;--beige:#C4B99A;
 --earth:#6B6352;--earthMid:#A89880;--dim:#3A3530;--dimLight:#1A1814;
 --border:#1E1C18;--borderMid:#2E2C28;--muted:#5A5548;--orange:#FC4C02;
 --serif:'Cinzel','Georgia',serif;--mono:'Courier New',monospace;
 --sans:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;background:var(--black);color:var(--white);font-family:var(--sans);min-height:100%}
button,input,textarea{font:inherit}button{-webkit-tap-highlight-color:transparent}
.wrap{max-width:540px;margin:0 auto;min-height:100vh;background:var(--black)}
.hero{text-align:center;padding:38px 20px 0}
.brand{font:300 10px var(--serif);letter-spacing:9px;color:var(--muted);margin-bottom:14px}
.logo{font:400 clamp(62px,16vw,96px)/.9 var(--serif);letter-spacing:.12em}
.protocol{font:300 9px var(--serif);letter-spacing:8px;color:var(--khaki);margin-top:8px}
.rule{width:32px;height:1px;background:var(--border);margin:14px auto}
.tag{font:300 9px var(--serif);letter-spacing:5px;color:var(--dim);margin-bottom:20px}
.progressLine{height:1px;background:var(--border);position:relative}
.progressFill{height:100%;background:var(--khaki)}
.stats{display:flex;justify-content:space-between;align-items:center;padding:13px 0}
.stat small{display:block;color:var(--dim);font:300 8px var(--serif);letter-spacing:3px;margin-bottom:3px}
.stat b{font:400 16px var(--mono)}
.realityCountdown{padding:2px 0 14px;text-align:center}.realityCountdown .days{font:400 12px var(--mono);letter-spacing:2.4px;color:var(--beige)}.realityCountdown .dest{margin-top:5px;font:300 7px var(--serif);letter-spacing:2.4px;color:var(--dim)}
.metrics{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.metric{flex:1;background:var(--dimLight);padding:9px 3px;text-align:center;border-right:1px solid var(--border)}
.metric:last-child{border-right:0}.metric small{display:block;color:var(--dim);font:300 8px var(--serif);letter-spacing:2px}.metric b{font:400 12px var(--mono)}
.tabs{position:sticky;top:0;z-index:30;display:flex;background:var(--black);border-bottom:1px solid var(--border)}
.tab{flex:1;padding:13px 1px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--dim);font:300 9px var(--serif);letter-spacing:2px;min-height:44px;touch-action:manipulation;cursor:pointer}
.tab.on{color:var(--white);border-bottom-color:var(--beige)}
.content{padding:14px}
.card{border:1px solid var(--borderMid);border-radius:8px;overflow:hidden;margin-bottom:12px}
.cardhead{padding:8px 13px;background:var(--dimLight);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.eyebrow{color:var(--beige);font:500 10px var(--serif);letter-spacing:3px}
.muted{color:var(--muted)}.mono{font-family:var(--mono)}.serif{font-family:var(--serif)}
.cardbody{padding:16px}.phase{font:500 9px var(--serif);letter-spacing:3px;color:var(--khaki);margin-bottom:5px}
.title{font:400 17px var(--serif);line-height:1.4}.sub{color:var(--muted);font-size:13px;font-style:italic;margin-top:4px}
.inner{background:var(--dimLight);border:1px solid var(--border);border-radius:5px;padding:12px 14px;margin-top:12px}
.label{font:500 9px var(--serif);letter-spacing:3px;color:var(--muted);margin-bottom:5px}
.mission{font:500 12px var(--serif);color:var(--beige);margin-bottom:6px}
.line{font-size:13px;line-height:1.7}.pace{font:400 11px var(--mono);color:var(--khaki);margin-top:4px}
.btn{width:100%;padding:12px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);font:500 10px var(--serif);letter-spacing:3px;min-height:44px;margin-top:8px}
.btn.primary{border-color:var(--khaki);color:var(--beige)}
.btn.done{border-color:var(--beige);background:var(--dimLight);color:var(--white)}
.c3TraceBtn{transition:transform .08s ease,background .12s ease,border-color .12s ease,color .12s ease}
.c3TraceBtn:active,.c3TraceBtn.is-pressed{transform:scale(.985);background:rgba(196,185,154,.10);border-color:var(--beige);color:var(--white)}
.c3TraceBtn.is-loading{background:rgba(196,185,154,.14);border-color:var(--beige);color:var(--white)}
.week{border:1px solid var(--border);border-radius:5px;margin-bottom:7px;overflow:hidden}
.week.current{border-color:var(--beige)}.weekrow{display:flex;gap:10px;align-items:center;padding:12px}
.wbox{width:40px;height:40px;border:1px solid var(--border);background:var(--dimLight);display:grid;place-items:center;border-radius:3px;font:500 14px var(--serif)}
.weekmain{flex:1;min-width:0}.wphase{font:500 8px var(--serif);letter-spacing:2px;color:var(--khaki)}.wtitle{font:400 13px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.wmeta{font:10px var(--mono);color:var(--dim);margin-top:2px}
.day{display:flex;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:4px;margin-bottom:4px}.day.today{border-color:var(--beige);background:var(--dimLight)}
.dayname{min-width:36px;text-align:center}.jp{font-size:17px}.en{font:8px var(--serif);letter-spacing:1px;color:var(--dim)}
.daybody{flex:1}.daytype{font:500 9px var(--serif);letter-spacing:1px;color:var(--khaki);margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{padding:3px 8px;border:1px solid var(--border);border-radius:20px;background:var(--black);color:var(--muted);font-size:10px}
.pacerow{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--dimLight);border:1px solid var(--border);border-radius:4px;margin-bottom:4px}
.pacew{min-width:52px;font:10px var(--serif);color:var(--khaki)}.pacebody{flex:1}.pacetype{font-size:13px}.zone{display:inline-block;padding:1px 6px;border:1px solid #c4b99a44;border-radius:2px;color:var(--beige);font:9px var(--mono);margin-bottom:3px}
.paceval{text-align:right;font:14px var(--mono);color:var(--beige)}
.logitem{padding:11px 0;border-bottom:1px solid var(--border)}.logtop{display:flex;justify-content:space-between;gap:10px}.logkm{color:var(--khaki);font:13px var(--mono)}.logdate{color:var(--dim);font:10px var(--mono)}.feel{color:var(--muted);font-size:12px;margin-top:4px}.strava{color:var(--orange);font:700 9px var(--mono);text-decoration:none;display:inline-block;margin-top:6px}
.logWeather{font:400 8px var(--mono);letter-spacing:1px;color:rgba(196,185,154,.58);white-space:nowrap}.sourceBadge{display:inline-flex;align-items:center;gap:6px;padding:3px 7px;border:1px solid rgba(196,185,154,.16);border-radius:999px;color:rgba(196,185,154,.58);font:400 8px var(--mono);letter-spacing:1px;white-space:nowrap}.sourceDot{width:5px;height:5px;border-radius:50%;background:var(--beige);opacity:.7}.sourceLayer{margin:4px 0 18px;padding:12px 14px;border:1px solid rgba(196,185,154,.14);border-radius:5px;background:rgba(196,185,154,.025)}.sourceGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.sourceNode{padding:8px 9px;border:1px solid rgba(196,185,154,.09);border-radius:4px;font:400 8px var(--mono);letter-spacing:1px;color:rgba(139,133,112,.46);display:flex;justify-content:space-between;gap:7px}.sourceNode.on{color:var(--beige);border-color:rgba(196,185,154,.22)}.sourceNode em{font-style:normal;color:rgba(139,133,112,.38)}.sourceNode.on em{color:rgba(196,185,154,.62)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(4,4,3,.96);display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(10px)}
.sheet{width:100%;max-width:400px;max-height:86vh;overflow:auto;background:var(--black);border:1px solid var(--borderMid);border-radius:10px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:var(--dimLight);border-bottom:1px solid var(--border)}
.close{background:none;border:0;color:var(--muted);font-size:24px}.sheetBody{padding:18px}
.field{margin-bottom:16px}.field label{display:block;color:var(--muted);font:10px var(--serif);letter-spacing:3px;margin-bottom:7px}.field input,.field textarea{width:100%;background:transparent;border:0;border-bottom:1px solid var(--border);outline:0;color:var(--white);padding:8px 0;font-family:var(--mono);font-size:15px}.field input::placeholder,.field textarea::placeholder{color:rgba(139,133,112,.28);opacity:1}.field input:placeholder-shown{color:rgba(245,240,232,.26)}.field input:not(:placeholder-shown){color:var(--white)}.field textarea{font-family:var(--sans);font-size:13px;resize:none}.fieldGuide{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font:400 8px var(--mono);letter-spacing:.8px;color:rgba(139,133,112,.42)}.fieldGuide .target{color:rgba(196,185,154,.52)}.fieldGuide .optional{color:rgba(139,133,112,.38)}.paceAutoBox{border-bottom:1px solid rgba(196,185,154,.22);padding:7px 0 9px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}.paceAutoValue{font:15px var(--mono);color:var(--white);letter-spacing:.2px}.paceAutoValue.empty{color:rgba(245,240,232,.26)}.paceAutoBadge{font:400 8px var(--mono);letter-spacing:1.4px;color:rgba(196,185,154,.58);border:1px solid rgba(196,185,154,.18);padding:4px 7px;border-radius:999px;white-space:nowrap}
.sagebox{text-align:center;padding:20px}.sageMark{width:58px;height:58px;border-radius:50%;border:1px solid var(--khaki);display:grid;place-items:center;margin:0 auto 18px;font:24px var(--serif);color:var(--beige)}.sageText{font:400 17px/2 var(--serif);padding:0 8px}
.onboard{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}.ob{max-width:380px;width:100%}.obtitle{text-align:center;margin-bottom:35px}.opt{width:100%;text-align:left;padding:18px 20px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--white);margin-bottom:10px}.optname{font:300 15px var(--serif)}.optdays{float:right;color:var(--beige);font:10px var(--serif);border:1px solid var(--borderMid);padding:3px 9px;border-radius:3px}.optdetail{clear:both;color:var(--muted);font-size:13px;line-height:1.6;margin-top:8px}

.rhythm{margin-top:12px;padding:13px 14px 11px;border:1px solid var(--border);border-radius:5px;background:linear-gradient(180deg,#11100d 0%,#0b0a08 100%);overflow:hidden;position:relative}
.rhythmTop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}.rhythmBpm{font:400 10px var(--mono);letter-spacing:1px;color:var(--khaki);white-space:nowrap}.rhythmStage{height:128px;position:relative;display:flex;align-items:center}.rhythm svg{width:100%;height:100%;display:block;overflow:visible}.rhythm path{fill:none;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}.rhythm .bodywave{stroke:var(--white);stroke-width:.56;opacity:var(--op,.82);animation:bodyFollow var(--body-cycle,5.4s) ease-in-out infinite alternate;animation-delay:var(--delay,0s)}.rhythm .heart{stroke:var(--white);stroke-width:1.35;opacity:.98;filter:drop-shadow(0 0 2.2px rgba(255,255,255,.34));animation:heartPulse var(--beat,3.2s) cubic-bezier(.42,0,.58,1) infinite}.rhythm.rest .heart{opacity:.56;animation:restHeart 4.4s ease-in-out infinite}.rhythm.rest .bodywave{animation:restBody 6.8s ease-in-out infinite alternate}.rhythm.encounter{cursor:pointer}.rhythm .sageTrace{stroke:#8f2f2a;stroke-width:1.45;opacity:0;stroke-linecap:round;stroke-dasharray:12 1000;stroke-dashoffset:1012;pointer-events:none}.rhythm.encounter .sageTrace{animation:sageTravel 1.65s ease-out .55s 1 forwards}.rhythmFoot{display:flex;justify-content:flex-start;align-items:center;margin-top:3px}.rhythmMotto{font:300 7px var(--serif);letter-spacing:2.4px;color:var(--dim)}
@keyframes heartPulse{0%,100%{transform:scaleY(1);opacity:.82}38%{transform:scaleY(1.018);opacity:.88}46%{transform:scaleY(1.105);opacity:1}53%{transform:scaleY(.985);opacity:.9}62%{transform:scaleY(1.025);opacity:.94}}
@keyframes bodyFollow{0%{transform:translateY(-.6px) scaleY(.985);opacity:calc(var(--op,.72)*.88)}100%{transform:translateY(.6px) scaleY(1.025);opacity:var(--op,.72)}}100%{transform:translateY(1px) scaleY(1.035);opacity:var(--op,.13)}}
@keyframes restHeart{0%,100%{transform:scaleY(.91);opacity:.42}50%{transform:scaleY(1.055);opacity:.68}}
@keyframes restBody{0%{transform:translateY(-.5px) scaleY(.975);opacity:calc(var(--op,.72)*.82)}100%{transform:translateY(.5px) scaleY(1.02);opacity:var(--op,.72)}}100%{transform:translateY(.7px) scaleY(1.035);opacity:var(--op,.13)}}
@keyframes sageTravel{0%{opacity:0;stroke-dashoffset:1012}8%{opacity:1}72%{opacity:.95}100%{opacity:0;stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.rhythm path,.rhythm .heart,.rhythm .bodywave,.rhythm .sageTrace{animation:none!important}}
@media(max-width:390px){.content{padding:12px}.logo{font-size:62px}.tab{letter-spacing:1px;font-size:8px}}
.traceStatus{margin-top:9px;font:7px var(--mono);letter-spacing:1.1px;color:rgba(196,185,154,.48);line-height:1.7}.traceStatus b{font-weight:400;color:rgba(245,240,232,.76)}

.lifeActivityGrid{display:grid;grid-template-columns:1fr;row-gap:0;padding-top:8px;width:100%}.lifeStackGroup{padding:0;border-top:1px solid rgba(196,185,154,.10)}.lifeStackGroup:first-child{border-top:0}.lifeStackHead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;background:transparent;border:0;color:inherit;text-align:left}.lifeStackTitle{font:9px var(--mono);letter-spacing:3px;color:rgba(196,185,154,.52)}.lifeStackSummary{margin-left:auto;min-width:0;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;font:8.5px var(--mono);letter-spacing:1.5px;color:rgba(196,185,154,.62)}.lifeStackChevron{flex:0 0 auto;font:12px var(--mono);color:rgba(196,185,154,.42);transition:transform .2s ease}.lifeStackGroup.open .lifeStackChevron{transform:rotate(45deg)}.lifeStackOptions{display:none;grid-template-columns:1fr;row-gap:12px;padding:0 0 15px}.lifeStackGroup.open .lifeStackOptions{display:grid}.lifeActivityOption{display:flex!important;align-items:center;gap:12px;min-width:0;width:100%;margin:0!important;font:9px var(--mono)!important;letter-spacing:1.8px;color:var(--muted)!important;line-height:1.2}.lifeActivityOption input[type="checkbox"]{appearance:none;-webkit-appearance:none;flex:0 0 18px;width:18px;height:18px;margin:0!important;border:1px solid rgba(196,185,154,.42);border-radius:4px;background:transparent;display:grid;place-items:center}.lifeActivityOption input[type="checkbox"]:checked:after{content:"";width:8px;height:8px;border-radius:2px;background:var(--beige)}.lifeActivityOption span{display:block;min-width:0;white-space:nowrap;overflow:visible}.lifeActivityOption:has(input:checked) span{color:var(--white)}@media(max-width:430px){.lifeActivityOption{gap:10px;font-size:8.5px!important;letter-spacing:1.5px}.lifeStackTitle{font-size:8.5px;letter-spacing:2.6px}}

/* MEMORY CALENDAR — v12.2 repair */
.memoryHero{padding:22px 26px 8px}
.memoryJourney{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-top:12px}
.memoryJourney .big{font:400 18px/1.45 var(--serif);color:var(--white)}
.memoryJourney .small{font:400 9px/1.7 var(--mono);letter-spacing:1.1px;color:var(--muted);text-align:right;white-space:nowrap}
.memoryStrip{margin-top:18px;padding-top:13px;border-top:1px solid var(--border)}
.memoryStripTitle{font:300 8px var(--serif);letter-spacing:2.1px;color:var(--dim);margin-bottom:9px}
.memoryTraceLine{display:grid;grid-template-columns:repeat(55,minmax(0,1fr));align-items:center;gap:2px;min-height:14px}
.memoryTraceNode{display:block;height:2px;border-radius:99px;background:rgba(196,185,154,.11)}
.memoryTraceNode.lived{height:4px;background:rgba(245,240,232,.82);box-shadow:0 0 5px rgba(245,240,232,.16)}
.memoryTraceNode.today{outline:1px solid rgba(196,185,154,.7);outline-offset:2px}
.memoryGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}

.memoryCell{position:relative;min-height:58px;border:1px solid rgba(196,185,154,.10);border-radius:3px;padding:6px;background:rgba(255,255,255,.008);overflow:hidden}
.memoryCell.blank{border-color:transparent;background:transparent}
.memoryCell.future{opacity:.38}
.memoryCell.lived{border-color:rgba(245,240,232,.25);cursor:pointer;background:rgba(245,240,232,.018)}
.memoryCell.today{box-shadow:inset 0 0 0 1px rgba(196,185,154,.78)}
.memoryCell.planted{opacity:.78;border-color:rgba(196,185,154,.26);background:rgba(196,185,154,.025)}
.plantedSeed{position:absolute;left:6px;bottom:7px;font:300 6px var(--mono);letter-spacing:1px;color:rgba(196,185,154,.78)}
.seedGrowth{position:absolute;left:6px;right:6px;bottom:6px;display:flex;align-items:center;gap:5px;font:300 5.8px var(--mono);letter-spacing:.8px;color:rgba(196,185,154,.80);white-space:nowrap;overflow:hidden}.seedGrowthMark{width:5px;height:5px;border-radius:50%;border:1px solid rgba(196,185,154,.72);flex:0 0 auto}.seedGrowth.sprout .seedGrowthMark{box-shadow:0 -4px 0 -2px rgba(196,185,154,.72)}.seedGrowth.grow .seedGrowthMark{width:7px;height:7px;box-shadow:0 0 8px rgba(196,185,154,.20)}.seedGrowth.reality .seedGrowthMark{background:rgba(245,240,232,.86);border-color:rgba(245,240,232,.86);box-shadow:0 0 8px rgba(245,240,232,.22)}
.seedStageCard{margin:0 0 18px;padding:12px 14px;border:1px solid rgba(196,185,154,.14);background:rgba(196,185,154,.025);display:flex;align-items:center;justify-content:space-between;gap:12px}.seedStageName{font:400 10px var(--mono);letter-spacing:2.2px;color:var(--beige)}.seedStageMeta{font:300 7px var(--mono);letter-spacing:1px;color:var(--dim);text-align:right}.seedTargetText{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.65!important;min-height:54px}

.seedMemoryLink{margin:16px 0 22px;border-top:1px solid rgba(196,185,154,.11);border-bottom:1px solid rgba(196,185,154,.11);padding:12px 0}
.seedMemoryLinkHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:5px}
.seedMemoryLinkTitle{font:300 8px var(--serif);letter-spacing:2.4px;color:var(--beige)}
.seedMemoryLinkCount{font:300 7px var(--mono);letter-spacing:1.2px;color:var(--dim)}
.seedMemoryItem{width:100%;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:10px 0;border:0;border-top:1px solid rgba(196,185,154,.07);background:transparent;text-align:left;color:inherit;cursor:pointer}
.seedMemoryDate{font:400 7.5px var(--mono);letter-spacing:1px;color:rgba(196,185,154,.55)}
.seedMemoryAct{font:400 10px var(--sans);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seedMemoryArrow{font:300 10px var(--mono);color:var(--beige)}
.seedMemoryEmpty{padding:9px 0 2px;font:300 8px var(--mono);letter-spacing:1px;color:var(--dim)}
.memorySeedLink{margin:18px 0 4px;border-top:1px solid rgba(196,185,154,.11);border-bottom:1px solid rgba(196,185,154,.11);padding:12px 0}
.memorySeedHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:5px}
.memorySeedTitle{font:300 8px var(--serif);letter-spacing:2.4px;color:var(--beige)}
.memorySeedCount{font:300 7px var(--mono);letter-spacing:1.2px;color:var(--dim)}
.memorySeedItem{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border:0;border-top:1px solid rgba(196,185,154,.07);background:transparent;text-align:left;color:inherit;cursor:pointer}
.memorySeedMoso{font:400 10px var(--sans);color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memorySeedStage{font:300 7px var(--mono);letter-spacing:1.2px;color:var(--beige)}

.seedForest{margin:0 26px 22px;padding:18px 18px 14px;border:1px solid rgba(196,185,154,.13);background:rgba(196,185,154,.018)}
.seedForestHead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:13px}
.seedForestTitle{font:300 9px var(--serif);letter-spacing:3px;color:var(--beige)}
.seedForestCount{font:300 7px var(--mono);letter-spacing:1.2px;color:var(--dim)}
.seedForestList{display:grid;gap:7px}
.seedForestItem{width:100%;display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid rgba(196,185,154,.09);background:transparent;text-align:left;color:inherit;cursor:pointer}
.seedForestDate{font:400 8px var(--mono);letter-spacing:1px;color:rgba(196,185,154,.55)}

function c3DemoSplits(log){
 const base=paceToSec(log?.pace||'6:43');
 const hr=Number(log?.avgHr||133)||133;
 // Preview only: deterministic offsets preserve overall character without overwriting the official log.
 const d=[10,3,-4,-6,-2,0], h=[-8,-3,0,4,7,5];
 const n=Math.max(2,splitRowCount(log?.distance||5));
 return Array.from({length:n},(_,i)=>({km:i+1,pace:secToPace(Math.max(180,base+(d[i%d.length]||0))),hr:String(Math.max(60,hr+(h[i%h.length]||0))),elevation:''}));
}
function historyRhythmLog(log){
 // Official C3 fallback: when STRAVA splits are absent, synthesize a stable living trace
 // from the official log values without modifying the stored activity.
 if(!Array.isArray(log?.splits)||!log.splits.length) return {...log,splits:c3DemoSplits(log),_c3Official:true};
 return log;
}

function streak(){

function sleepDigitsToDisplay(v){
 const s=String(v??'').replace(/\D/g,'').slice(0,4); if(!s)return '';
 if(s.length<=2){const h=Number(s);return h<=24?`${h}:00`:''}
 const h=Number(s.slice(0,-2)),m=Number(s.slice(-2)); if(h>24||m>59||(h===24&&m>0))return '';
 return `${h}:${String(m).padStart(2,'0')}`;
}
function normalizeSleepValue(v){
 const raw=String(v??'').trim(); if(!raw)return '';
 if(raw.includes(':')){const [h,m='0']=raw.split(':');const hh=Number(h),mm=Number(m);return (hh>=0&&hh<=24&&mm>=0&&mm<60&&!(hh===24&&mm>0))?`${hh}:${String(mm).padStart(2,'0')}`:''}
 if(/^\d+(\.\d+)?$/.test(raw) && raw.includes('.')){const n=Number(raw);if(n>=0&&n<=24){const h=Math.floor(n),m=Math.round((n-h)*60);return `${h}:${String(m===60?0:m).padStart(2,'0')}`}}
 return sleepDigitsToDisplay(raw);
}

function memoryMiniPath(log){
 const hr=Number(log?.avgHr)||110, rpe=Number(log?.rpe)||3, f=Number(log?.fatigue)||1;
 const amp=Math.max(3,Math.min(11,3+(hr-100)*.08+rpe*.45-f*.18));
 let pts=[];for(let i=0;i<=24;i++){const x=i/24*100,e=Math.sin(Math.PI*i/24);const y=12+Math.sin(i*.72+(hr%11)*.1)*amp*e*.22+Math.sin(i*.31)*amp*e*.12;pts.push(`${x.toFixed(1)},${y.toFixed(1)}`)}
 return 'M'+pts.join(' L');
}

function seedForestHTML(){

  const primary=loadMosoSeed();

   const s=planted[id];
   if(!s)return;
   const duplicate=s.id===primary.id || (s.date===primary.date && String(s.moso||'')===String(primary.moso||''));
   if(!duplicate)rows.push({...s,_seedId:id,_primary:false});
  });

    <span class="seedForestMoso">${esc(s.moso||'UNTITLED SEED')}</span>

  }).join('');

function memoryCalendar(){
 // MEMORY STABLE — isolated, fail-soft island.
 // It must render even if seed/weather/trace metadata is malformed.
 try{
   const startKey='2026-09-01', realityKey='2026-10-25';
   const safeToday=(()=>{try{return todayStr()}catch(e){return '2026-09-03'}})();
   const parseKey=(k)=>{const m=String(k||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;return Date.UTC(+m[1],+m[2]-1,+m[3])};
   const startMs=parseKey(startKey), endMs=parseKey(realityKey), todayMs=parseKey(safeToday)||startMs;
   const days=[];
   for(let ms=startMs;ms<=endMs;ms+=86400000){const d=new Date(ms);days.push({date:`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`,day:d.getUTCDate(),dow:d.getUTCDay()})}
   const logsSafe=Array.isArray(state.logs)?state.logs:[];
   const planted=loadPlantedSeeds();
   const byDate={};logsSafe.forEach((l,i)=>{if(l&&/^2026-\d{2}-\d{2}$/.test(String(l.date||'')))byDate[String(l.date)]={l,i}});
   const first=days[0]?.dow||0,cells=Array(first).fill(null).concat(days),lived=days.filter(x=>byDate[x.date]).length;
   const elapsed=Math.max(1,Math.min(days.length,Math.floor((todayMs-startMs)/86400000)+1));
   const pct=Math.round((lived/days.length)*100);
   let seed={...DEFAULT_MOSO_SEED};try{seed=loadMosoSeed()||seed}catch(e){}
   const moso=esc(seed.moso||'ハーフ2時間を切る'),why=esc(seed.why||'もう一度、走れる身体を取り戻す');
   const destination=esc(seed.destination||'TEGA HALF'),target=esc(seed.target||'1:59:00');
   const remaining=Math.max(0,Math.ceil((endMs-todayMs)/86400000));
   const mini=(log)=>{try{return `<svg class="miniTrace" viewBox="0 0 100 24"><path d="${memoryMiniPath(log)}"/></svg>`}catch(e){return '<span class="seedDot"></span>'}};
   const weather=(log)=>{try{const w=log?.weather;return w?`<span class="weatherMini">${weatherGlyph(w.code)}</span>`:''}catch(e){return ''}};
   return `<div class="content"><div class="memoryHero"><div class="label">LIFE MEMORY · SEED → REALITY</div><div class="memoryJourney"><div class="big">${moso}</div><div class="small">${lived} MEMORIES<br>${lived} / ${days.length} DAYS LIVED · ${pct}%</div></div><div class="memoryStrip"><div class="memoryStripTitle">LIVING TRACE · OCT 25</div><div class="memoryTraceLine">${days.map(x=>`<span class="memoryTraceNode ${byDate[x.date]?'lived ':''}${x.date===safeToday?'today':''}"></span>`).join('')}</div></div></div>${seedForestHTML()}<div class="inner"><div class="logtop"><div><div class="label">55 DAYS OF LIFE</div><div class="mission">一日ひとつの、生きた痕跡。</div></div><span class="phase">${remaining} DAYS →</span></div><div class="memoryGrid">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(x=>`<div class="memoryDow">${x}</div>`).join('')}${cells.map(x=>{if(!x)return '<div class="memoryCell blank"></div>';const hit=byDate[x.date],future=x.date>safeToday;const plantedSeed=Object.values(planted).find(v=>v&&v.date===x.date);return `<div class="memoryCell ${hit?'lived ':''}${future?'future ':''}${plantedSeed?'planted ':''}${x.date===safeToday?'today':''}" ${hit?`onclick="openHistory(${hit.i})"`:future?`onclick="openMosoSeed('${plantedSeed?.id||x.date}')"`:''}><span class="d">${x.day}</span>${hit?mini(hit.l):(plantedSeed?seedGrowthHTML(plantedSeed):'<span class="seedDot"></span>')}${hit?weather(hit.l):''}</div>`}).join('')}</div><div class="memoryLegend"><span>● SEED / FUTURE</span><span>TRACE = LIFE MEMORY</span><span>□ TODAY</span></div></div><div class="inner"><div class="label">WHY</div><div class="line">${why}</div><div class="fieldGuide" style="margin-top:12px"><span>THE DAYS ARE THE REALITY.</span><span>${destination} · ${target}</span></div></div></div>`;
 }catch(err){
   console.error('MEMORY stable fallback',err);
   return `<div class="content"><div class="inner" style="margin-top:0"><div class="label">LIFE MEMORY · SEED → REALITY</div><div class="title">ハーフ2時間を切る</div><div class="sub">MEMORY IS STILL ALIVE.</div></div><div class="inner"><div class="label">55 DAYS OF LIFE</div><div class="line">9/1 → 10/25</div><div class="sub">記録は保持されています。MEMORY表示の一部だけを安全に待機しています。</div></div></div>`;
 }
}

  <div class="field"><label>ACTIVITY TYPE · INTENTION PRESET</label><select id="latype" onchange="syncActivityFields()" style="width:100%;background:transparent;border:0;border-bottom:1px solid var(--border);border-radius:0;color:var(--white);font:400 15px var(--mono);padding:11px 0"><option value="RUN" ${plannedPrimary==='RUN'?'selected':''}>RUN</option><option value="WALK" ${plannedPrimary==='WALK'?'selected':''}>WALK</option><option value="CYCLING" ${plannedPrimary==='CYCLING'?'selected':''}>CYCLING</option><option value="SWIM" ${plannedPrimary==='SWIM'?'selected':''}>SWIM</option><option value="HIKE" ${plannedPrimary==='HIKE'?'selected':''}>HIKE</option><option value="STRENGTH" ${plannedPrimary==='STRENGTH'?'selected':''}>STRENGTH</option><option value="HIIT" ${plannedPrimary==='HIIT'?'selected':''}>HIIT</option><option value="YOGA" ${plannedPrimary==='YOGA'?'selected':''}>YOGA</option><option value="PILATES" ${plannedPrimary==='PILATES'?'selected':''}>PILATES</option><option value="STRETCH" ${plannedPrimary==='STRETCH'?'selected':''}>STRETCH</option><option value="MOBILITY" ${plannedPrimary==='MOBILITY'?'selected':''}>MOBILITY</option><option value="MEDITATION" ${plannedPrimary==='MEDITATION'?'selected':''}>MEDITATION / 瞑想</option><option value="MOSO" ${plannedPrimary==='MOSO'?'selected':''}>MŌSŌ</option><option value="SLEP" ${plannedPrimary==='SLEP'?'selected':''}>SLEP</option><option value="BREATHWORK" ${plannedPrimary==='BREATHWORK'?'selected':''}>BREATHWORK / 呼吸</option><option value="RECOVERY" ${plannedPrimary==='RECOVERY'?'selected':''}>RECOVERY</option><option value="REST" ${plannedPrimary==='REST'?'selected':''}>REST / 完全休養</option><option value="OTHER" ${plannedPrimary==='OTHER'?'selected':''}>OTHER</option></select><div class="fieldGuide"><span>LIFE · BODY · MIND</span><span>CHANGES RHYTHM DNA</span></div></div>
  <div class="field"><label>LIFE STACK · ALSO TODAY</label><div class="lifeActivityGrid">${[
    ['MOVE',['STRENGTH','HIIT','YOGA','PILATES','STRETCH','MOBILITY']],
    ['MIND',['MEDITATION','BREATHWORK','MOSO','SLEP']],
    ['RECOVERY',['RECOVERY']]
  ].map(([group,items])=>{const picked=items.filter(a=>planned.includes(a)&&plannedPrimary!==a);return `<div class="lifeStackGroup"><button type="button" class="lifeStackHead" onclick="toggleLifeStack(this)"><span class="lifeStackTitle">${group}</span><span class="lifeStackSummary">${picked.length?picked.map(displayActivity).join(' · '):'NONE'}</span><span class="lifeStackChevron">＋</span></button><div class="lifeStackOptions">${items.map(a=>`<label class="lifeActivityOption"><input type="checkbox" name="lifeActivityExtra" value="${a}" ${planned.includes(a)&&plannedPrimary!==a?'checked':''} onchange="updateLifeStackSummaries()"><span>${displayActivity(a)}</span></label>`).join('')}</div></div>`}).join('')}</div><div class="fieldGuide"><span>BODY → MOVE → MIND → RECOVERY</span><span>ONE DAY = ONE LIFE MEMORY</span></div></div>
  <div class="field"><label>RPE · 1–10</label><input id="lrpe" type="number" min="1" max="10" value="${edit?.rpe||''}" placeholder="4"><div class="fieldGuide"><span>TODAY · SELF CHECK</span><span>1 EASY — 10 MAX</span></div></div>
  <div class="field"><label>FATIGUE · 1–5</label><input id="lfat" type="number" min="1" max="5" value="${edit?.fatigue||''}" placeholder="2"><div class="fieldGuide"><span class="optional">OPTIONAL · SELF CHECK</span><span>1 LIGHT — 5 HEAVY</span></div></div>
  <div class="field"><label>MOOD · 1–5</label><input id="lmood" type="number" min="1" max="5" value="${edit?.mood||''}" placeholder="3"><div class="fieldGuide"><span>TODAY · SELF CHECK</span><span>1 LOW — 5 GOOD</span></div></div>
  <div class="field"><label>PAIN · 0–10</label><input id="lpain" type="number" min="0" max="10" value="${edit?.pain??''}" placeholder="0"><div class="fieldGuide"><span>TODAY · SELF CHECK</span><span>0 NONE — 10 STRONG</span></div></div>
 </div>
 <div class="splitBlock" data-split-field><div class="splitHead"><div><div class="splitTitle">HYBRID TRACE <span class="splitBadge">C3</span></div></div><div class="splitSub">HEALTH SOURCE → CONTINUOUS TRACE<br>PACE · HR · ELEVATION</div></div><div id="splitRows" class="splitGrid"></div><div class="splitNote">HEALTH SOURCEのSPLITを連続補間し、滑らかな大きな流れ＋細かな生命反応へ変換。PACEは 0643 → 6:43。未入力ならC3 LIVING。</div></div>
 <div class="field"><label>HUMAN LAYER · FEELING / MEMO · optional</label><textarea id="lf" rows="3" placeholder="機械には分からないことだけ。空欄でもLOGできます。">${edit?.feeling||''}</textarea><div class="fieldGuide"><span>WORDS ARE OPTIONAL</span><span>LIFE IT FIRST</span></div></div>
 <div class="field" data-strava-field><label>STRAVA URL · optional</label><input id="lu" value="${edit?.stravaUrl||''}" placeholder="https://www.strava.com/activities/..."></div>
 <div style="display:flex;gap:8px">${edit?'<button class="btn" onclick="deleteLog()">DELETE</button>':''}<button class="btn primary" onclick="addOrUpdateLog()">${edit?'UPDATE →':'LOG →'}</button></div></div></div></div>`;
}

function historyModal(){
 const log=state.viewIndex!==null?state.logs[state.viewIndex]:null;
 if(!log)return '';
 const time=log.timeHms||(log.durationSec?secToHMS(log.durationSec):log.duration?secToHMS(Number(log.duration)*60):'—');
 const rhythmHr=log.avgHr?`${log.avgHr} BPM · REAL`:'MRC RHYTHM';
 const rhythmLog=historyRhythmLog(log);
 const source=(Array.isArray(log.splits)&&log.splits.length)?'HEALTH SPLIT':'C3 LIVING';
 const healthSource=displaySource(log.healthSource||'MANUAL');
 const acts=(log.activities&&log.activities.length?log.activities:[log.activityType||'RUN']).map(normalizeActivity);
 const distanceSet=['RUN','WALK','CYCLING','SWIM','HIKE'];
 const hasDistanceActivity=acts.some(a=>distanceSet.includes(a));
 const moveSet=['RUN','WALK','CYCLING','SWIM','HIKE','STRENGTH','HIIT','YOGA','PILATES','STRETCH','MOBILITY'];
 const mindSet=['MEDITATION','BREATHWORK','MOSO','SLEP'];
 const recoverySet=['RECOVERY','REST'];
 const moveActs=acts.filter(a=>moveSet.includes(a)).map(displayActivity);
 const mindActs=acts.filter(a=>mindSet.includes(a)).map(displayActivity);
 const recoveryActs=acts.filter(a=>recoverySet.includes(a)).map(displayActivity);
 const bodyParts=[]; if(log.sleep)bodyParts.push(normalizeSleepValue(log.sleep)+' H'); if(log.weight)bodyParts.push(log.weight+' KG');
 const lifeLine=`<div class="lifeLine"><div class="lifeLineTitle">LIFE STACK · LIVING LINE</div>${[['BODY',bodyParts],['MOVE',moveActs],['MIND',mindActs],['RECOVERY',recoveryActs]].map(([k,v])=>`<div class="lifeLineRow ${v.length?'on':''}"><div class="lifeLineRail"><i class="lifeLineDot"></i></div><div class="lifeLineKey">${k}</div><div class="lifeLineVal">${v.length?v.join(' · '):'—'}</div></div>`).join('')}</div>`;
 return `<div class="modal"><div class="sheet"><div class="sheetHead"><span class="eyebrow">LIFE MEMORY · ${log.date}</span><button class="close" onclick="closeModal()">×</button></div><div class="sheetBody">
 <div class="label">LIVING TRACE · FULL LIVING C3</div>${livingRhythm(rhythmLog)}<div class="traceStatus">BODY = <b>BASE</b> · MOVE = <b>FLOW</b> · MIND = <b>BREATH</b> · RECOVERY = <b>CALM</b> · SOURCE = <b>${source}</b></div>
 ${lifeLine}
 ${memoryLinkedSeedsHTML(log)}
 <div class="historyMeta"><div><small>SOURCE</small><b>${healthSource}</b></div><div><small>SLEEP</small><b>${log.sleep?normalizeSleepValue(log.sleep)+' H':'—'}</b></div><div><small>WEIGHT</small><b>${log.weight?log.weight+' KG':'—'}</b></div><div><small>DISTANCE</small><b>${log.distance?log.distance+' KM':'—'}</b></div><div><small>TIME</small><b>${time}</b></div><div><small>PACE</small><b>${log.pace?log.pace+'/KM':'—'}</b></div><div><small>RHYTHM</small><b>${rhythmHr}</b></div><div><small>ACTIVITY</small><b>${(log.activities&&log.activities.length?log.activities:[log.activityType||'RUN']).map(a=>displayActivity(a)).join(' + ')}</b></div><div><small>MAX HR</small><b>${log.maxHr||'—'}</b></div><div><small>CADENCE</small><b>${log.cadence?log.cadence+' SPM':'—'}</b></div><div><small>ELEVATION</small><b>${log.elevationGain?log.elevationGain+' M':'—'}</b></div><div><small>RPE</small><b>${log.rpe||'—'}</b></div><div><small>FATIGUE</small><b>${log.fatigue||'—'}</b></div><div><small>MOOD</small><b>${log.mood||'—'}</b></div><div><small>PAIN</small><b>${log.pain!==''&&log.pain!=null?log.pain:'—'}</b></div></div>
 ${(hasDistanceActivity&&Array.isArray(rhythmLog.splits)&&rhythmLog.splits.length)?`<div class="splitHistory"><div class="splitHistoryRow" style="color:rgba(196,185,154,.58)"><span>SPLIT</span><span>PACE</span><span>HR</span><span>+M</span></div>${rhythmLog.splits.map((sp,i)=>`<div class="splitHistoryRow"><span>${i+1}K</span><b>${sp.pace?sp.pace+'/KM':'—'}</b><b>${sp.hr||'—'}</b><b>${sp.elevation!==''&&sp.elevation!=null?sp.elevation:'—'}</b></div>`).join('')}</div>`:''}
 <div class="historyNote">${log.feeling||'—'}</div>
 ${log.stravaUrl?`<a class="strava" target="_blank" href="${log.stravaUrl}" style="display:block;margin-top:12px">STRAVA →</a>`:''}
 <button class="btn primary" onclick="editFromHistory()">ADD / EDIT DETAILS →</button>
 <div class="fieldGuide" style="margin-top:9px"><span>MEMORY FIRST</span><span>DETAILS CAN WAIT</span></div>
 <div class="wmeta" style="margin-top:10px;text-align:center">FULL LIVING TRACE · BODY + MOVE + MIND + RECOVERY · SOURCE ${healthSource}</div>
 </div></div></div>`;
}

function sageModal(){
 const log=state.encounterIndex!==null?state.logs[state.encounterIndex]:latestTodayLog();
 const s=sageForLog(log);
 return `<div class="modal" onclick="closeModal()"><div class="sheet" onclick="event.stopPropagation()"><div class="sheetHead"><span class="eyebrow">SAGE ENCOUNTER</span><button class="close" onclick="closeModal()">×</button></div><div class="sagebox"><div class="sageMark">${s[0]}</div><div class="phase">${s[1]}</div><div class="sub" style="margin-bottom:18px">${s[2]}</div><div class="sageText">${s[3]}</div><button class="btn primary" onclick="closeModal()">RETURN TO RHYTHM</button><div class="wmeta" style="margin-top:12px">18% REACTION · prototype response / AI connection follows</div></div></div></div>`;
}

function memoryLinkedSeedsHTML(log){
 if(!log)return '';
 const planted=loadPlantedSeeds();
 const primary=loadMosoSeed();
 const seeds=[{seed:primary,primary:true}].concat(Object.entries(planted).filter(([id,v])=>v&&v.id!==primary.id).map(([id,v])=>({seed:{...v,id:v.id||id},primary:false})));
 const linked=seeds.filter(({seed})=>{
   const text=`${seed?.moso||''} ${seed?.why||''} ${seed?.destination||''} ${seed?.target||''}`.toUpperCase();
   const growthStart=(text.includes('SLEP')||text.includes('英語'))?(seed.date||RACE_KEY):START_KEY;
   const growthEnd=seed.date||RACE_KEY;
   return log.date>=growthStart&&log.date<=growthEnd&&seedRelevant(log,seed);
 });
 if(!linked.length)return '';
 const rows=linked.map(({seed,primary})=>{const g=seedGrowth(seed);const click=primary?`openMosoSeed()`:`openMosoSeed('${seed.id}')`;return `<button class="memorySeedItem" onclick="${click}"><span class="memorySeedMoso">${esc(seed.moso||'UNTITLED SEED')}</span><span class="memorySeedStage">${g.stage} →</span></button>`}).join('');
 return `<div class="memorySeedLink"><div class="memorySeedHead"><span class="memorySeedTitle">SEEDS NOURISHED BY THIS LIFE MEMORY</span><span class="memorySeedCount">${linked.length} SEED${linked.length===1?'':'S'}</span></div>${rows}</div>`;
}

function seedLinkedMemoriesHTML(seed){
 const realityDay=seed?.date||RACE_KEY,today=todayStr();
 const text=`${seed?.moso||''} ${seed?.why||''} ${seed?.destination||''} ${seed?.target||''}`.toUpperCase();
 const growthStart=(text.includes('SLEP')||text.includes('英語'))?realityDay:START_KEY;
 const growthEnd=today<realityDay?today:realityDay;
 const hits=(state.logs||[]).map((l,i)=>({l,i})).filter(x=>x.l&&x.l.date>=growthStart&&x.l.date<=growthEnd&&seedRelevant(x.l,seed)).sort((a,b)=>String(b.l.date).localeCompare(String(a.l.date)));
 const rows=hits.map(({l,i})=>{
   const acts=(l.activities&&l.activities.length?l.activities:[l.activityType||'RUN']).map(displayActivity).join(' · ');
   return `<button class="seedMemoryItem" onclick="state.historyIndex=${i};state.modal='history';vibe();render()"><span class="seedMemoryDate">${esc(l.date.slice(5).replace('-','/'))}</span><span class="seedMemoryAct">${esc(acts)}</span><span class="seedMemoryArrow">→</span></button>`;
 }).join('');
 return `<div class="seedMemoryLink"><div class="seedMemoryLinkHead"><span class="seedMemoryLinkTitle">LIFE MEMORIES THAT GROW THIS SEED</span><span class="seedMemoryLinkCount">${hits.length} MEMORY${hits.length===1?'':'IES'}</span></div>${rows||'<div class="seedMemoryEmpty">まだ、この未来を育てたLIFE MEMORYはありません。</div>'}</div>`;
}

function mosoSeedModal(){
 const selectedId=state.seedDate||null;
 const planted=loadPlantedSeeds();
 const selectedExisting=selectedId&&planted[selectedId];
 const isDateSlot=selectedId&&/^\d{4}-\d{2}-\d{2}$/.test(selectedId)&&!selectedExisting;
 const seed=selectedId?(selectedExisting?{...selectedExisting}:{id:'seed-'+selectedId,kind:'LIFE',moso:'',why:'',date:selectedId,destination:'',target:''}):loadMosoSeed();
 const eyebrow=selectedId?`MŌSŌ · SEED · ${seed.date}`:'MŌSŌ · SEED';
 return `<div class="modal"><div class="sheet"><div class="sheetHead"><span class="eyebrow">${eyebrow}</span><button class="close" onclick="closeModal()">×</button></div><div class="sheetBody">
 <div style="padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid rgba(196,185,154,.11)"><div class="label" style="color:var(--beige)">INITIAL IMPULSE｜初期衝動</div><div class="line" style="margin-top:8px">理由より先に生まれた『やりたい』を大切に。</div></div>
 <div class="label">未来に、ひとつの種を植える。</div><div class="mission" style="margin:8px 0 14px">MŌSŌ → LIFE MEMORY → REALITY</div>${seedGrowthTrackHTML(seed)}
 ${seedLinkedMemoriesHTML(seed)}
 <div class="field"><label>MŌSŌ</label><input id="seedMoso" value="${esc(seed.moso)}" placeholder="ハーフ2時間を切る"></div>
 <div class="field"><label>WHY</label><textarea id="seedWhy" rows="3" placeholder="なぜ、この未来を生きたい？">${esc(seed.why)}</textarea></div>
 <div class="field"><label>REALITY DAY</label><input id="seedDate" type="date" value="${esc(seed.date)}"></div>
 <div class="field"><label>DESTINATION</label><input id="seedDestination" value="${esc(seed.destination)}" placeholder="TEGA HALF"></div>
 <div class="field"><label>TARGET</label><textarea id="seedTarget" class="seedTargetText" rows="2" placeholder="1:59:00">${esc(seed.target)}</textarea></div>
 <button class="btn primary" onclick="saveMosoSeed()">PLANT THIS SEED →</button>
 <div class="fieldGuide"><span>${selectedId?'INDEPENDENT SEED':'PRIMARY MRC SEED'}</span><span>TRACE = LIFE MEMORY</span></div></div></div></div>`;
}
function saveMosoSeed(){
 const date=document.getElementById('seedDate')?.value||RACE_KEY;
 const v={moso:document.getElementById('seedMoso')?.value.trim()||DEFAULT_MOSO_SEED.moso,why:document.getElementById('seedWhy')?.value.trim()||'',date,destination:document.getElementById('seedDestination')?.value.trim()||'REALITY',target:document.getElementById('seedTarget')?.value.trim()||''};
 if(state.seedDate){
   const all=loadPlantedSeeds();
   const old=all[state.seedDate];
   const id=old?.id||(/^\d{4}-\d{2}-\d{2}$/.test(state.seedDate)?`seed-${date}`:state.seedDate);
   if(old)delete all[state.seedDate];
   all[id]={...v,id,kind:old?.kind||(/SLEP|英語/i.test(`${v.moso} ${v.destination}`)?'SLEP':'LIFE')};savePlantedSeeds(all);
 }else{
   saveMosoSeedData({...v,id:'mrc-half-2026',kind:'MRC'});
 }
 state.seedDate=null;state.modal=null;vibe();render();
}

function modal(){
 if(state.modal==='log')return logModal();
 if(state.modal==='habits')return habitsModal();
 if(state.modal==='history')return historyModal();
 if(state.modal==='sage')return sageModal();
 if(state.modal==='intention')return intentionModal();
 if(state.modal==='mososeed')return mosoSeedModal();
 return '';
}

function main(){
 const body=state.tab==='today'?today():state.tab==='weeks'?weeks():state.tab==='schedule'?schedule():state.tab==='pace'?pace():state.tab==='memory'?memoryCalendar():logs();
 return `<div class="wrap">${header()}${tabs()}${body}${modal()}</div>`;
}
function render(){document.getElementById('app').innerHTML=state.type?main():onboarding();if(state.modal==='log'){const edit=state.editIndex!==null?state.logs[state.editIndex]:null;setTimeout(()=>{renderSplitInputs(edit?.splits||[]);syncActivityFields()},0)}if(state.type&&state.logs.some(l=>l.date===todayStr()))setTimeout(ensureTodayWeather,0);if(state.type)setTimeout(ensureHistoryWeather,150)}
// Official C3 LIVING TRACE
render();
</script>
